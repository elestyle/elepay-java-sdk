name: Publish to Maven Central

on:
  push:
    tags: ['release-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Deploy to Central Publisher Portal
    # Only the public repo publishes to Central; the private mirror never does.
    if: github.repository == 'elestyle/elepay-java-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 + Central credentials + GPG key
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy to Central
        run: mvn -B -ntp -DskipTests -Pdeploy-central,sign-artifacts deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
