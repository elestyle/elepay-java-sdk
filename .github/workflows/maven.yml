name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Test
        run: mvn -B -ntp -Dstyle.color=always test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to GitHub Packages
    # Tag push -> release version. Master push -> -SNAPSHOT. PRs and
    # manual dispatch do not publish.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release creates the Release on tag
      packages: write   # push artifacts to GitHub Packages (Maven registry)
    steps:
      - uses: actions/checkout@v4

      # Matches the rest of the CI/Javadoc/api-compat workflows. The pom's
      # `compiler-release-flag` profile activates on JDK 9+ and pins the
      # compiler to `--release 8`, so no Java 9+ API can leak into the jar.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          # Writes a settings.xml with a <server id="github"> whose
          # username/password are read from the env vars named below.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # On master we publish a floating -SNAPSHOT based on the next patch
      # of the current pom version. Skipped on tag builds so the tagged
      # release version is deployed as-is.
      - name: Bump pom to next -SNAPSHOT (master only)
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          BASE=${CURRENT%-SNAPSHOT}
          IFS=. read -r MAJ MIN PATCH <<< "$BASE"
          SNAP="${MAJ}.${MIN}.$((PATCH+1))-SNAPSHOT"
          echo "Deploying snapshot version: $SNAP"
          mvn -B -ntp versions:set -DnewVersion="$SNAP" -DgenerateBackupPoms=false

      # `altDeploymentRepository=github::<url>` overrides the deploy target
      # at the CLI so the pom stays free of org-specific URLs.
      # ${GITHUB_REPOSITORY} is "owner/repo", injected by the runner.
      - name: Deploy to GitHub Packages
        run: |
          mvn -B -ntp -DskipTests \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${GITHUB_REPOSITORY} \
            deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/elepay-java-sdk-*.jar dist/
          cp target/elepay-java-sdk-*.pom dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload to workflow artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: elepay-java-sdk-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
